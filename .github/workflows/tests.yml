name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools
      - name: Run tests
        run: samtools --version | head -1 && bash tests/run_tests.sh
